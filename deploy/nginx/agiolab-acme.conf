# Temporary HTTP-only vhost used once to issue the agiolab.com certificate.
# Install as /etc/nginx/conf.d/agiolab-acme.conf while .env.prd is being set up,
# then replace it with deploy/nginx/agiolab.conf after certbot succeeds.
server {
    listen 80;
    listen [::]:80;
    server_name password.agiolab.com secrets.agiolab.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
