# Host nginx edge for agiolab.com
#
# Client credential management (*ClientCredential) is a local, admin-only
# extension.  It is blocked here on the public edge so it can only be reached
# from the Secrets Manager container (127.0.0.1) through ./bin/start.sh.

map $http_x_amz_target $pwdgen_deny_client_credential {
    default 0;
    # ListClientCredentials is plural; the other three are singular.
    ~*^secretsmanager\.(createclientcredential|getclientcredential|deleteclientcredential|listclientcredentials)$ 1;
}

# ---------------------------------------------------------------------------
# Rate limiting (http context).
#
# The generator endpoint is public, unauthenticated and CPU-bound: every request
# forks a Python process. Application-level throttling is per-process and resets
# with the container, so the edge is the durable control. Amounts are sized for
# human use of a password generator (a person generates a handful per minute),
# not for bulk API traffic.
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=pwdgen_generate:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=pwdgen_conn:10m;

# The Secrets Manager is credential-authenticated; this ceiling only blunts
# brute-force and accidental retry storms.
limit_req_zone $binary_remote_addr zone=pwdgen_secrets:10m rate=120r/m;

#
# Install as /etc/nginx/conf.d/agiolab.conf (or an equivalent included file).
# The app and Secrets Manager are published on loopback only:
#   127.0.0.1:18000  password generator
#   127.0.0.1:18001  secrets manager
#
# Replace the certificate paths below with the real certificate covering
# password.agiolab.com and secrets.agiolab.com (SAN or *.agiolab.com).
#
# Do NOT change `proxy_set_header Host $http_host;`: AWS SigV4 signs the Host
# header and path, so nginx must forward both unchanged.

# ---------------------------------------------------------------------------
# Password generator: agiolab.com (canonical) and password.agiolab.com
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name agiolab.com password.agiolab.com;

    # Keep HTTP-01 renewals working while redirecting normal traffic.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agiolab.com password.agiolab.com;

    ssl_certificate     /etc/letsencrypt/live/agiolab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agiolab.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;

    # Generation is the only expensive, unauthenticated endpoint.
    location = /api/generate {
        limit_req zone=pwdgen_generate burst=10 nodelay;
        limit_conn pwdgen_conn 5;
        limit_req_status 429;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: an appended chain puts the caller-controlled
        # value first, which lets anyone pick their own rate-limit bucket.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------------
# www.agiolab.com -> https://agiolab.com
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name www.agiolab.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://agiolab.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.agiolab.com;

    ssl_certificate     /etc/letsencrypt/live/agiolab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agiolab.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    return 301 https://agiolab.com$request_uri;
}

# ---------------------------------------------------------------------------
# secrets.agiolab.com
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name secrets.agiolab.com;

    # Keep HTTP-01 renewals working while redirecting normal traffic.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name secrets.agiolab.com;

    ssl_certificate     /etc/letsencrypt/live/agiolab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agiolab.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 2m;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location / {
        if ($pwdgen_deny_client_credential) {
            return 403;
        }
        limit_req zone=pwdgen_secrets burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:18001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
