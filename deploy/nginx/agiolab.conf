# Host nginx edge for agiolab.com
#
# Install as /etc/nginx/conf.d/agiolab.conf (or an equivalent included file).
# The app and Secrets Manager are published on loopback only:
#   127.0.0.1:18000  password generator
#   127.0.0.1:18001  secrets manager
#
# Replace the certificate paths below with the real certificate covering
# password.agiolab.com and secrets.agiolab.com (SAN or *.agiolab.com).
#
# Do NOT change `proxy_set_header Host $http_host;`: AWS SigV4 signs the Host
# header and path, so nginx must forward both unchanged.

# ---------------------------------------------------------------------------
# password.agiolab.com
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name password.agiolab.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name password.agiolab.com;

    ssl_certificate     /etc/letsencrypt/live/agiolab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agiolab.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------------
# secrets.agiolab.com
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name secrets.agiolab.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name secrets.agiolab.com;

    ssl_certificate     /etc/letsencrypt/live/agiolab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agiolab.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 2m;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:18001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
